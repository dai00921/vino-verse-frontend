<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winery Experience</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Sawarabi+Mincho&display=swap" rel="stylesheet">
</head>
<body>

    <main id="app-container">

        <!-- Welcome Screen -->
        <section id="welcome-screen" class="screen active">
            <div class="content-wrapper">
                <div class="icon-circle">✨</div>
                <h1 class="font-serif">あなたの物語から、詩を紡ぐ</h1>
                <p>いくつかの質問にお答えください。<br>あなただけの特別なワインラベルを創作します。</p>
                <button id="welcome-start-btn" class="btn btn-primary">
                    <span>始める</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </button>
            </div>
        </section>

        <!-- Wine Selection Screen -->
        <section id="wine-selection-screen" class="screen">
            <div class="content-wrapper">
                <div class="icon-circle">🍷</div>
                <h1 class="font-serif">ワインを選ぶ</h1>
                <p>直感で惹かれる一本を選んでください。</p>
                <div id="wine-list" class="wine-list">
                    <!-- ワインの選択肢がここに動的に挿入されます -->
                </div>
                <button id="select-wine-btn" class="btn btn-primary" disabled>
                    <span>このワインにする</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </button>
            </div>
        </section>
            

        <!-- Question Screen -->
        <section id="question-screen" class="screen">
            <div id="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
            <div class="content-wrapper">
                <div class="question-header">
                    <span id="question-category-icon" class="category-icon"></span>
                    <h2 id="question-title" class="font-serif"></h2>
                </div>
                <p id="question-text"></p>
                <textarea id="answer-input" rows="5" placeholder="あなたの言葉で..."></textarea>
                <div id="choice-buttons-container" class="choice-buttons-container"></div>
                <div class="navigation-buttons">
                    <button id="back-btn" class="btn btn-secondary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                        <span>戻る</span>
                    </button>
                    <button id="next-btn" class="btn btn-primary">
                        <span>次へ</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                    </button>
                </div>
            </div>
        </section>

        <!-- Confirmation Screen -->
        <section id="confirm-screen" class="screen">
            <div class="content-wrapper">
                <div class="icon-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                </div>
                <h1 class="font-serif">あなたの物語を確認</h1>
                <p>これらの素敵な回答から、あなただけの詩を紡ぎます。</p>
                <div id="answers-list"></div>
                <div class="navigation-buttons">
                    <button id="edit-btn" class="btn btn-secondary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
                        <span>修正する</span>
                    </button>
                    <button id="submit-btn" class="btn btn-primary">
                        <span>詩を生成する</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 22a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z"/><path d="m22 10-4.03 5.76a2 2 0 0 1-3.46-2.02l.3-1.19a2 2 0 0 0-2.1-2.81l-3.1.62a2 2 0 0 1-1.8-1.16L6.28 7.2a2 2 0 0 1 2.1-2.81l3.1-.62a2 2 0 0 0 1.8-1.16L14.32 2"/></svg>
                    </button>
                </div>
            </div>
        </section>

        <!-- Result Screen -->
        <section id="result-screen" class="screen">
            <div class="content-wrapper">
                <h1 class="font-serif">あなただけの詩的アートラベル</h1>
                <p>あなたの感情から生まれた、世界に一つだけのアートです。</p>
                <div id="wine-label-container">
                    <!-- JSで生成されるアートと詩 -->
                </div>
                <div class="result-actions">
                    <button id="download-btn" class="btn btn-secondary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                        <span>アートを保存</span>
                    </button>
                    <button id="restart-btn" class="btn btn-primary">
                        <span>もう一度試す</span>
                    </button>
                </div>
            </div>
        </section>

    </main>

    <script src="js/app.js"></script>
</body>
</html>
